name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            binary: daggerdeep
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm
            binary: daggerdeep
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            binary: daggerdeep.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daggerdeep-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries for release
        run: |
          mkdir release-assets
          mv artifacts/daggerdeep-linux-x64/daggerdeep     release-assets/daggerdeep-linux-x64
          mv artifacts/daggerdeep-macos-arm/daggerdeep     release-assets/daggerdeep-macos-arm
          mv artifacts/daggerdeep-windows-x64/daggerdeep.exe release-assets/daggerdeep-windows-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/daggerdeep-linux-x64
            release-assets/daggerdeep-macos-arm
            release-assets/daggerdeep-windows-x64.exe
